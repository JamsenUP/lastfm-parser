name: Update Music

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Last.fm and update Gist
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          RESPONSE=$(curl -s "https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=jamsenup&api_key=02c9bd9aa8737a715c3cc09eef021c63&format=json&limit=1")
          TOTAL=$(echo "$RESPONSE" | jq -r '.recenttracks["@attr"].total // "0"')

          if [ "$TOTAL" = "0" ] || [ -z "$TOTAL" ]; then
            TRACK="Сейчас ничего не играет"
          else
            TRACK_DATA=$(echo "$RESPONSE" | jq -r '.recenttracks.track | if type == "array" then .[0] else . end')
            ARTIST=$(echo "$TRACK_DATA" | jq -r '.artist["#text"] // .artist.name // "Исполнитель"')
            NAME=$(echo "$TRACK_DATA" | jq -r '.name // "Трек"')
            NOW=$(echo "$TRACK_DATA" | jq -r '.["@attr"].nowplaying // ""')
            if [ "$NOW" = "true" ]; then
              TRACK="🎵 Сейчас играет: $ARTIST — $NAME"
            else
              TRACK="⏸️ На паузе (последний трек: $ARTIST — $NAME)"
            fi
          fi

          echo "Track: $TRACK"
          PAYLOAD=$(jq -n --arg t "$TRACK" '{"files":{"music.txt":{"content":$t}}}')
          curl -s -X PATCH \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/gists/$GIST_ID"
